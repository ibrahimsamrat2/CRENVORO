<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="c-grad-tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="45%" stop-color="#6C3BFF"/>
      <stop offset="100%" stop-color="#4F1EE3"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#c-grad-tile)"/>
  <!-- Top Inner Glow Stroke -->
  <rect width="506" height="506" x="3" y="3" rx="113" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Letter C Architecture -->
  <!-- Outer circle R=172, inner circle R=92, center (256, 256) -->
  <!-- Top terminal cuts at 45 deg, bottom terminal cuts at 45 deg -->
  <path
    d="M 386 160
       C 352 114 298 84 238 84
       C 143 84 66 161 66 256
       C 66 351 143 428 238 428
       C 298 428 352 398 386 352
       L 316 304
       C 296 332 264 348 232 348
       C 181 348 140 307 140 256
       C 140 205 181 164 232 164
       C 264 164 296 180 316 208
       Z"
    fill="#FFFFFF"
  />

  <!-- Floating Vector Diamond in center-right -->
  <rect
    x="298"
    y="220"
    width="62"
    height="62"
    rx="10"
    transform="rotate(45 329 251)"
    fill="#FFFFFF"
  />
  <circle cx="329" cy="251" r="7" fill="#6C3BFF"/>
</svg>