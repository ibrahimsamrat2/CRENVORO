  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile-bg-3)"/>
  <rect width="506" height="506" x="3" y="3" rx="113" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>

  <g filter="url(#drop-s3)">
