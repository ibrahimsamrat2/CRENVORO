         C 60 354 140 434 238 434
         C 296 434 348 410 384 368
         L 336 320
         C 310 348 276 364 238 364
         C 178 364 130 316 130 256
         C 130 196 178 148 238 148
         C 276 148 310 164 336 192
         Z"
      fill="#FFFFFF"
    />
    <!-- In the aperture: Precision Rotated Diamond Spark (the original icon symbol!) -->
