      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#6C3BFF"/>
      <stop offset="100%" stop-color="#551FFF"/>
    </linearGradient>
    <filter id="drop-s3" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#37169A" flood-opacity="0.35"/>
