<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tile-bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#6C3BFF"/>
      <stop offset="100%" stop-color="#551FFF"/>
    </linearGradient>
    <filter id="drop-s" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#37169A" flood-opacity="0.35"/>
