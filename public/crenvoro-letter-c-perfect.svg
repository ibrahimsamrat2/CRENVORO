<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bg-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="45%" stop-color="#6C3BFF"/>
      <stop offset="100%" stop-color="#5319EC"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#37169A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle in Signature Electric Purple -->
  <rect width="512" height="512" rx="116" fill="url(#bg-purple)"/>
  <rect width="506" height="506" x="3" y="3" rx="113" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>

  <g filter="url(#soft-shadow)">
    <!-- Letter C with 45-degree angled terminals -->
    <path
      d="M 378 134
         A 172.5 172.5 0 1 0 378 378
         L 318 318
         A 88 88 0 1 1 318 194
         Z"
      fill="#FFFFFF"
    />

    <!-- Diamond Vector Spark in the aperture -->
    <rect
      x="314"
      y="226"
      width="60"
      height="60"
      rx="10"
      transform="rotate(45 344 256)"
      fill="#FFFFFF"
    />
  </g>
</svg>